<!DOCTYPE html>
<html>
<head><title>Assign Admin - CADET-I</title></head>
<body style="font-family:sans-serif;max-width:600px;margin:40px auto;padding:20px">
<h2>Assign Admin Role</h2>
<p>Target: <strong>divineifesinachi13@gmail.com</strong></p>

<div id="status" style="margin:16px 0;padding:12px;border-radius:8px;background:#f3f4f6">
  Click the button to assign admin.
</div>

<div id="loginFields" style="display:none;margin:12px 0">
  <p style="font-size:13px;color:#666">Anonymous sign-in failed. Sign in with an existing admin account:</p>
  <input id="loginEmail" type="email" placeholder="Admin email" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;margin-bottom:8px;box-sizing:border-box">
  <input id="loginPass" type="password" placeholder="Password" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;margin-bottom:8px;box-sizing:border-box">
</div>

<button id="actionBtn" style="padding:10px 24px;background:#078f3b;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:700">Assign Admin</button>

<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBL5ajB2nuMNxJaHsxKWk0zS2UgXMdtSMA",
  authDomain: "cadet-1.firebaseapp.com",
  projectId: "cadet-1",
  storageBucket: "cadet-1.firebasestorage.app",
  messagingSenderId: "1029091794371",
  appId: "1:1029091794371:web:0eab0f7aa7f5ada6b43176",
  measurementId: "G-1Q69WT4C4Y"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const status = document.getElementById('status');
const btn = document.getElementById('actionBtn');
const loginFields = document.getElementById('loginFields');
const loginEmail = document.getElementById('loginEmail');
const loginPass = document.getElementById('loginPass');
const targetEmail = 'divineifesinachi13@gmail.com';

function setStatus(msg, isError = false) {
  status.innerHTML = msg;
  status.style.background = isError ? '#fef2f2' : '#f0fdf4';
  status.style.color = isError ? '#991b1b' : '#166534';
  status.style.border = '1px solid ' + (isError ? '#fecaca' : '#bbf7d0');
}

async function doAssign(userId, userData) {
  const adminRef = db.collection('admins').doc(userId);
  const existing = await adminRef.get();

  if (existing.exists) {
    setStatus('Already an admin! Role: ' + (existing.data().role || 'unknown'));
    return true;
  }

  await adminRef.set({
    email: targetEmail,
    role: 'manager',
    createdAt: firebase.firestore.Timestamp.now()
  });

  setStatus('SUCCESS! <b>' + (userData.firstName || '') + ' ' + (userData.surname || '') + '</b> (' + targetEmail + ') is now an admin with role: <b>manager</b>');
  return true;
}

btn.onclick = async () => {
  btn.disabled = true;
  btn.textContent = 'Working...';

  try {
    // Find user by email
    setStatus('Searching for ' + targetEmail + '...');
    const userSnap = await db.collection('users')
      .where('email', '==', targetEmail)
      .limit(1)
      .get();

    if (userSnap.empty) {
      setStatus('No user found with email <b>' + targetEmail + '</b>.<br>They need to sign up first via Portal Activation, then run this again.', true);
      btn.disabled = false;
      btn.textContent = 'Retry';
      return;
    }

    const userDoc = userSnap.docs[0];
    const userId = userDoc.id;
    const userData = userDoc.data();
    setStatus('Found: ' + (userData.firstName || '') + ' ' + (userData.surname || '') + '<br>Creating admin record...');

    // Try anonymous auth first, then fall back to manual sign-in
    try {
      await auth.signInAnonymously();
      await doAssign(userId, userData);
    } catch (anonErr) {
      loginFields.style.display = 'block';
      setStatus('Anonymous sign-in not available. Sign in with your existing admin account below.', false);
      btn.textContent = 'Sign In & Assign';
      btn.disabled = false;

      // Override button for manual sign-in
      btn.onclick = async () => {
        if (!loginEmail.value || !loginPass.value) {
          setStatus('Enter admin email and password.', true);
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Signing in...';
        try {
          await auth.signInWithEmailAndPassword(loginEmail.value, loginPass.value);
          await doAssign(userId, userData);
          btn.textContent = 'Done';
          loginFields.style.display = 'none';
        } catch (loginErr) {
          setStatus('Sign-in failed: ' + (loginErr.message || 'Check credentials'), true);
          btn.disabled = false;
          btn.textContent = 'Try Again';
        }
      };
    }
  } catch (err) {
    setStatus('Error: ' + (err.message || err.code || 'Unknown error'), true);
    console.error(err);
    btn.disabled = false;
    btn.textContent = 'Retry';
  }
};
</script>
</body>
</html>
