<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NUESA UNN - Faculty of Engineering, University of Nigeria Nsukka" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
      :root {
        --emerald: #059669;
        --emerald-light: #ecfdf5;
        --emerald-dark: #047857;
        --emerald-glow: rgba(5,150,105,0.12);
        --gold: #D97706;
        --gold-light: #fef3c7;
        --gold-dark: #b45309;
        --gold-glow: rgba(217,119,6,0.12);
        --mint: #10B981;
        --bg: #ffffff;
        --bg-alt: #f8faf8;
        --bg-warm: #fffbeb;
        --bg-dark: #030712;
        --bg-slate: #0F172A;
        --text: #111827;
        --text-muted: #6b7280;
        --text-light: #9ca3af;
        --text-dark: #f1f5f9;
        --text-dark-muted: #94a3b8;
        --border: #e5e7eb;
        --border-light: #f3f4f6;
        --border-dark: #1e293b;
        --font-heading: 'EB Garamond', serif;
        --font-body: 'Inter', sans-serif;
        --radius: 12px;
        --radius-sm: 8px;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
        --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
        --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.06), 0 2px 4px -1px rgba(0,0,0,0.04);
        --shadow-lg: 0 10px 40px rgba(0,0,0,0.08);
        --shadow-xl: 0 20px 60px rgba(0,0,0,0.1);
        --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);

        --green: var(--emerald);
        --green-light: var(--emerald-light);
        --green-dark: var(--emerald-dark);
        --orange: var(--gold);
        --orange-light: var(--gold-light);
        --orange-dark: var(--gold-dark);
      }
      html { scroll-behavior: smooth; }
      body { font-family: var(--font-body); color: var(--text); background: var(--bg); margin: 0; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      h1, h2, h3, h4, h5, h6, .font-heading { font-family: var(--font-heading); }
    </style>
    <title>NUESA UNN · Faculty of Engineering</title>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
